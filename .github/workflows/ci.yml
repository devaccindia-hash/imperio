name: CI

# Lints and unit tests on every push and pull request. The end-to-end
# scenarios (tools/bench/run-e2e-tests.sh) need a real desktop, a GPU video
# encoder and an interactive session, so they are run locally before a release.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "**.md"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --locked
